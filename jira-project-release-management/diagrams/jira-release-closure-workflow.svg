<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#334155"/></marker>
<style>
.t{font:700 30px Arial;fill:#0f172a}.s{font:16px Arial;fill:#475569}.h{font:700 18px Arial;fill:#0f172a}.b{font:14px Arial;fill:#334155}.n{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.j{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}.g{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.p{fill:#faf5ff;stroke:#9333ea;stroke-width:2;rx:14}.o{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:14}.a{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arr)}
</style></defs>
<rect width="1200" height="760" fill="#fff"/>
<text x="600" y="48" text-anchor="middle" class="t">Jira Release Closure Workflow</text>
<text x="600" y="78" text-anchor="middle" class="s">Confirm delivery, capture evidence, communicate outcomes and close the release</text>
<rect x="55" y="145" width="205" height="130" class="j"/><text x="157" y="183" text-anchor="middle" class="h">Release Complete</text><text x="157" y="213" text-anchor="middle" class="b">Deployment verified</text><text x="157" y="240" text-anchor="middle" class="b">Issues reviewed</text>
<rect x="315" y="145" width="205" height="130" class="n"/><text x="417" y="183" text-anchor="middle" class="h">Closure Review</text><text x="417" y="213" text-anchor="middle" class="b">Evidence and defects</text><text x="417" y="240" text-anchor="middle" class="b">Approvals and risks</text>
<rect x="575" y="145" width="205" height="130" class="p"/><text x="677" y="183" text-anchor="middle" class="h">Documentation</text><text x="677" y="213" text-anchor="middle" class="b">Release notes</text><text x="677" y="240" text-anchor="middle" class="b">RCA / lessons learned</text>
<rect x="835" y="145" width="145" height="130" class="o"/><text x="907" y="183" text-anchor="middle" class="h">Communicate</text><text x="907" y="213" text-anchor="middle" class="b">Stakeholders</text><text x="907" y="240" text-anchor="middle" class="b">Final status</text>
<rect x="1030" y="145" width="125" height="130" class="g"/><text x="1092" y="183" text-anchor="middle" class="h">Close</text><text x="1092" y="213" text-anchor="middle" class="b">Jira version</text><text x="1092" y="240" text-anchor="middle" class="b">Records</text>
<path d="M260 210 H305 M520 210 H565 M780 210 H825 M980 210 H1020" class="a"/>
<rect x="150" y="385" width="900" height="140" class="n"/>
<text x="600" y="425" text-anchor="middle" class="h">Release Closure Record</text>
<text x="600" y="460" text-anchor="middle" class="b">Release outcome • deployed versions • issue status • validation evidence</text>
<text x="600" y="490" text-anchor="middle" class="b">Open defects • incidents • follow-up owners • lessons learned • communications</text>
<path d="M1092 275 V345 H600 V375" class="a"/>
<rect x="250" y="590" width="700" height="95" class="j"/>
<text x="600" y="628" text-anchor="middle" class="h">Jira Release Version Marked Released</text>
<text x="600" y="657" text-anchor="middle" class="b">Close only after required evidence and authorized closure checks are complete</text>
<path d="M600 525 V580" class="a"/>
<text x="600" y="725" text-anchor="middle" class="s">Illustrative closure flow — retain unresolved work as tracked follow-up items.</text>
