<style>
.t{font:700 30px Arial;fill:#0f172a}.s{font:16px Arial;fill:#475569}.h{font:700 18px Arial;fill:#0f172a}.b{font:14px Arial;fill:#334155}.n{fill:#f8fafc;stroke:#64748b;stroke-width:2;rx:14}.j{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}.c{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:14}.d{fill:#faf5ff;stroke:#9333ea;stroke-width:2;rx:14}.r{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:14}.a{stroke:#334155;stroke-width:2.3;fill:none;marker-end:url(#arr)}
</style></defs>
<rect width="1200" height="760" fill="#fff"/>
<text x="600" y="48" text-anchor="middle" class="t">Jira and CI/CD Integration Workflow</text>
<text x="600" y="78" text-anchor="middle" class="s">Trace a planned change through validation, artifact creation and deployment</text>

<rect x="55" y="145" width="205" height="125" class="j"/>
<text x="157" y="182" text-anchor="middle" class="h">Jira Issue</text><text x="157" y="211" text-anchor="middle" class="b">PLAT-301</text><text x="157" y="237" text-anchor="middle" class="b">Story / acceptance criteria</text>

<rect x="315" y="145" width="205" height="125" class="n"/>
<text x="417" y="182" text-anchor="middle" class="h">GitHub PR</text><text x="417" y="211" text-anchor="middle" class="b">Issue key in title</text><text x="417" y="237" text-anchor="middle" class="b">Review + approval</text>

<rect x="575" y="145" width="205" height="125" class="c"/>
<text x="677" y="182" text-anchor="middle" class="h">CI Pipeline</text><text x="677" y="211" text-anchor="middle" class="b">Build + unit tests</text><text x="677" y="237" text-anchor="middle" class="b">Quality + security gates</text>

<rect x="835" y="145" width="145" height="125" class="d"/>
<text x="907" y="182" text-anchor="middle" class="h">Artifact</text><text x="907" y="211" text-anchor="middle" class="b">Versioned image</text><text x="907" y="237" text-anchor="middle" class="b">ECR</text>

<rect x="1030" y="145" width="125" height="125" class="r"/>
<text x="1092" y="182" text-anchor="middle" class="h">Deploy</text><text x="1092" y="211" text-anchor="middle" class="b">EKS</text><text x="1092" y="237" text-anchor="middle" class="b">GitOps</text>

<path d="M260 207 H305 M520 207 H565 M780 207 H825 M980 207 H1020" class="a"/>

<rect x="145" y="365" width="910" height="135" class="n"/>
<text x="600" y="405" text-anchor="middle" class="h">Release governance and traceability</text>
<text x="600" y="440" text-anchor="middle" class="b">Jira release / version • pipeline run • image tag or digest • deployment revision</text>
<text x="600" y="470" text-anchor="middle" class="b">Approval evidence • test results • security findings • post-deployment validation</text>

<path d="M677 270 V330 H600 V355" class="a"/>
<path d="M907 270 V330 H600" class="a"/>
<path d="M1092 270 V330 H600" class="a"/>

