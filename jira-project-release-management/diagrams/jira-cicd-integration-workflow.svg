<text x="600" y="603" text-anchor="middle" class="h">Jira issue and release updated</text>
<text x="600" y="633" text-anchor="middle" class="b">Manual update or configured automation/integration; never assume every event syncs automatically</text>
<path d="M600 500 V555" class="a"/>
<text x="600" y="720" text-anchor="middle" class="s">Illustrative workflow — exact stages, tools and approval gates depend on team policy.</text>
