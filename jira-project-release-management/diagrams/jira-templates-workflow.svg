<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <style>
      .title{font:700 27px Arial,sans-serif;fill:#172033}
      .sub{font:16px Arial,sans-serif;fill:#526078}
      .box{fill:#f7f9fc;stroke:#486581;stroke-width:2;rx:14}
      .head{font:700 18px Arial,sans-serif;fill:#17324d}
      .body{font:14px Arial,sans-serif;fill:#334155}
      .arrow{stroke:#64748b;stroke-width:2.5;fill:none;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">Jira Project &amp; Release Management — Template Workflow</text>
  <text x="600" y="78" text-anchor="middle" class="sub">Reusable records that keep planning, testing, approvals and production evidence consistent</text>
  <rect class="box" x="55" y="150" width="190" height="125"/>
  <text class="head" x="150" y="185" text-anchor="middle">Plan</text>
  <text class="body" x="150" y="215" text-anchor="middle">Sprint plan</text>
  <text class="body" x="150" y="239" text-anchor="middle">Release plan</text>
  <rect class="box" x="285" y="150" width="190" height="125"/>
  <text class="head" x="380" y="185" text-anchor="middle">Build &amp; Track</text>
  <text class="body" x="380" y="215" text-anchor="middle">Story / task record</text>
  <text class="body" x="380" y="239" text-anchor="middle">Dependency notes</text>
  <rect class="box" x="515" y="150" width="190" height="125"/>
  <text class="head" x="610" y="185" text-anchor="middle">Test</text>
  <text class="body" x="610" y="215" text-anchor="middle">Test case</text>
  <text class="body" x="610" y="239" text-anchor="middle">Bug report</text>
  <rect class="box" x="745" y="150" width="190" height="125"/>
  <text class="head" x="840" y="185" text-anchor="middle">Approve</text>
  <text class="body" x="840" y="215" text-anchor="middle">Readiness checklist</text>
  <text class="body" x="840" y="239" text-anchor="middle">Approval record</text>
  <rect class="box" x="975" y="150" width="170" height="125"/>
  <text class="head" x="1060" y="185" text-anchor="middle">Close</text>
  <text class="body" x="1060" y="215" text-anchor="middle">Release notes</text>
  <text class="body" x="1060" y="239" text-anchor="middle">RCA / follow-ups</text>
  <path class="arrow" d="M245 212 H280"/><path class="arrow" d="M475 212 H510"/><path class="arrow" d="M705 212 H740"/><path class="arrow" d="M935 212 H970"/>
  <rect x="150" y="350" width="900" height="90" rx="14" fill="#eef4f8" stroke="#9fb3c8" stroke-width="1.5"/>
  <text class="head" x="600" y="385" text-anchor="middle">Every template should capture</text>
  <text class="body" x="600" y="415" text-anchor="middle">Owner • Jira issue / release link • dates • evidence • decision • status • next action</text>
</svg>