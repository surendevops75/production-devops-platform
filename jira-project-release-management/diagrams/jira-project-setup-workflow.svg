<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18324b" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#54718d"/></marker>
  <style>
    .h{font:700 34px Arial,sans-serif;fill:#142d45}.sub{font:18px Arial,sans-serif;fill:#536b82}
    .t{font:700 20px Arial,sans-serif;fill:#17344f}.d{font:16px Arial,sans-serif;fill:#405a72}
    .small{font:15px Arial,sans-serif;fill:#536b82}.num{font:700 17px Arial,sans-serif;fill:#fff}
    .line{stroke:#54718d;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .card{fill:#fff;stroke:#cfdae6;stroke-width:2;rx:18;filter:url(#shadow)}
    .pill{fill:#eaf2fb;stroke:#c5d8eb;stroke-width:1.5;rx:12}
  </style>
</defs>
<rect width="1600" height="920" fill="url(#bg)"/>
<text x="80" y="78" class="h">Jira Project Setup — Scrum Delivery Workflow</text>
<text x="80" y="112" class="sub">Configure the project foundation before creating epics, stories, sprints and releases</text>

<!-- Main setup row -->
<g>
  <rect x="80" y="175" width="320" height="190" class="card"/>
  <circle cx="115" cy="210" r="20" fill="#1769aa"/><text x="115" y="216" text-anchor="middle" class="num">1</text>
  <text x="150" y="217" class="t">Create Jira project</text>
  <text x="110" y="260" class="d">• Jira Software</text>
  <text x="110" y="290" class="d">• Scrum project template</text>
  <text x="110" y="320" class="d">• Project name and key</text>

  <rect x="455" y="175" width="320" height="190" class="card"/>
  <circle cx="490" cy="210" r="20" fill="#1769aa"/><text x="490" y="216" text-anchor="middle" class="num">2</text>
  <text x="525" y="217" class="t">Set project access</text>
  <text x="485" y="260" class="d">• Project roles</text>
  <text x="485" y="290" class="d">• Administrators and developers</text>
  <text x="485" y="320" class="d">• Permission scheme</text>

  <rect x="830" y="175" width="320" height="190" class="card"/>
  <circle cx="865" cy="210" r="20" fill="#1769aa"/><text x="865" y="216" text-anchor="middle" class="num">3</text>
  <text x="900" y="217" class="t">Configure work types</text>
  <text x="860" y="260" class="d">• Epic, Story, Task</text>
  <text x="860" y="290" class="d">• Bug and Sub-task</text>
  <text x="860" y="320" class="d">• Fields and issue screens</text>

  <rect x="1205" y="175" width="315" height="190" class="card"/>
  <circle cx="1240" cy="210" r="20" fill="#1769aa"/><text x="1240" y="216" text-anchor="middle" class="num">4</text>
  <text x="1275" y="217" class="t">Configure Scrum board</text>
  <text x="1235" y="260" class="d">• Backlog and active sprint</text>
  <text x="1235" y="290" class="d">• Columns and statuses</text>
  <text x="1235" y="320" class="d">• Team and estimation</text>
</g>
<path d="M400 270 H445" class="line"/><path d="M775 270 H820" class="line"/><path d="M1150 270 H1195" class="line"/>

<!-- Downstream -->
<path d="M1360 365 V430 H1210" class="line"/>
<rect x="890" y="430" width="630" height="125" class="card"/>
<text x="930" y="474" class="t">Project foundation ready</text>
<text x="930" y="510" class="d">Team can now create epics, refine the backlog and plan sprints.</text>
<rect x="930" y="525" width="520" height="1" fill="#e1e8ef"/>

<path d="M890 493 H790 V620 H690" class="line"/>
<rect x="80" y="620" width="610" height="190" class="card"/>
<text x="120" y="665" class="t">Next project-management activities</text>
<rect x="120" y="690" width="245" height="44" class="pill"/><text x="242" y="718" text-anchor="middle" class="d">Create epics and stories</text>
<rect x="390" y="690" width="245" height="44" class="pill"/><text x="512" y="718" text-anchor="middle" class="d">Prioritize backlog</text>
<rect x="120" y="750" width="245" height="44" class="pill"/><text x="242" y="778" text-anchor="middle" class="d">Plan sprint</text>
<rect x="390" y="750" width="245" height="44" class="pill"/><text x="512" y="778" text-anchor="middle" class="d">Track delivery</text>

<rect x="790" y="620" width="730" height="190" class="card"/>
<text x="830" y="665" class="t">Example project configuration</text>
<text x="830" y="710" class="d">Project name: Production DevOps Platform</text>
<text x="830" y="744" class="d">Project key: PLAT  (example — choose an available key)</text>
<text x="830" y="778" class="d">Method: Scrum  •  Team: DevOps / Platform Engineering</text>

<text x="80" y="870" class="small">Note: Jira menus and available project templates vary by Jira Cloud plan, product edition and project type.</text>
</svg>