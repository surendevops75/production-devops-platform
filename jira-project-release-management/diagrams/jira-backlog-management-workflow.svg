<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="900" viewBox="0 0 1550 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18324b" flood-opacity=".12"/></filter>
 <marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11Z" fill="#56738e"/></marker>
 <style>
 .h{font:700 34px Arial;fill:#17334d}.s{font:18px Arial;fill:#5b7186}.t{font:700 20px Arial;fill:#17334d}.d{font:16px Arial;fill:#405b73}
 .card{fill:#fff;stroke:#cbd8e5;stroke-width:2;rx:16;filter:url(#shadow)}.line{stroke:#56738e;stroke-width:3;fill:none;marker-end:url(#arr)}
 .tag{font:700 14px Arial;fill:#34536e}
 </style>
</defs>
<rect width="1550" height="900" fill="url(#bg)"/>
<text x="70" y="75" class="h">Jira Backlog Management Workflow</text>
<text x="70" y="112" class="s">Turn requirements into prioritized, estimated and sprint-ready work</text>

<rect x="70" y="175" width="320" height="175" class="card"/>
<text x="105" y="220" class="t">1. Capture work</text>
<text x="105" y="260" class="d">• Stories and requirements</text>
<text x="105" y="292" class="d">• Tasks and technical debt</text>
<text x="105" y="324" class="d">• Bugs and improvement work</text>

<rect x="455" y="175" width="320" height="175" class="card"/>
<text x="490" y="220" class="t">2. Refine backlog</text>
<text x="490" y="260" class="d">• Clarify descriptions</text>
<text x="490" y="292" class="d">• Define acceptance criteria</text>
<text x="490" y="324" class="d">• Split large work items</text>

<rect x="840" y="175" width="320" height="175" class="card"/>
<text x="875" y="220" class="t">3. Prioritize</text>
<text x="875" y="260" class="d">• Business value</text>
<text x="875" y="292" class="d">• Risk and urgency</text>
<text x="875" y="324" class="d">• Dependencies</text>

<rect x="1225" y="175" width="255" height="175" class="card"/>
<text x="1260" y="220" class="t">4. Estimate</text>
<text x="1260" y="260" class="d">• Story points</text>
<text x="1260" y="292" class="d">• Team discussion</text>
<text x="1260" y="324" class="d">• Capacity awareness</text>

<path d="M390 262 H445 M775 262 H830 M1160 262 H1215" class="line"/>
<path d="M1350 350 V435 H1120" class="line"/>

<rect x="760" y="435" width="720" height="180" class="card"/>
<text x="800" y="480" class="t">5. Sprint readiness review</text>
<text x="800" y="520" class="d">• Clear requirement and acceptance criteria</text>
<text x="800" y="552" class="d">• Dependencies understood and owners identified</text>
<text x="800" y="584" class="d">• Estimate agreed and work small enough for a sprint</text>

<path d="M760 525 H620 V680 H510" class="line"/>
<rect x="70" y="680" width="440" height="145" class="card"/>
<text x="110" y="725" class="t">Not ready</text>
<text x="110" y="765" class="d">Return for clarification, splitting or dependency work.</text>
<text x="110" y="795" class="d">Keep it in the backlog; do not force it into a sprint.</text>

<path d="M1120 615 V680" class="line"/>
<rect x="760" y="680" width="720" height="145" class="card"/>
<text x="800" y="725" class="t">6. Ready for sprint planning</text>
<text x="800" y="765" class="d">Product Owner and team select work based on priority, capacity and sprint goal.</text>
<text x="800" y="795" class="d">The team confirms its forecast during sprint planning.</text>

<text x="70" y="870" class="s">Backlog order is a prioritization aid, not an automatic commitment to deliver every item.</text>
</svg>