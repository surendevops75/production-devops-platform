<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9fc"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18324b" flood-opacity=".12"/></filter>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#58748e"/></marker>
 <style>
 .head{font:700 34px Arial;fill:#17334d}.sub{font:18px Arial;fill:#587087}
 .title{font:700 21px Arial;fill:#17334d}.body{font:16px Arial;fill:#405b73}
 .card{fill:#fff;stroke:#cbd8e5;stroke-width:2;rx:16;filter:url(#shadow)}
 .epic{fill:#e8ddfb;stroke:#8c64c5;stroke-width:2;rx:14}
 .story{fill:#e4f1ff;stroke:#4b91cf;stroke-width:2;rx:12}
 .task{fill:#e4f5ec;stroke:#4d9b72;stroke-width:2;rx:12}
 .bug{fill:#ffebeb;stroke:#d76b6b;stroke-width:2;rx:12}
 .subtask{fill:#f0f3f6;stroke:#aab8c5;stroke-width:2;rx:10}
 .line{stroke:#58748e;stroke-width:2.5;fill:none;marker-end:url(#arr)}
 </style>
</defs>
<rect width="1500" height="900" fill="url(#bg)"/>
<text x="70" y="72" class="head">Jira Work Item Hierarchy</text>
<text x="70" y="108" class="sub">Break a large platform initiative into trackable requirements and engineering work</text>

<rect x="70" y="155" width="1360" height="145" class="epic"/>
<text x="110" y="198" class="title">EPIC — Order Management</text>
<text x="110" y="235" class="body">Deliver reliable order creation, processing and status tracking for the microservices platform.</text>
<text x="110" y="270" class="body">Example key: PLAT-100  |  Owner: Product Owner  |  Target: Release v1.5.0</text>

<!-- story boxes -->
<path d="M750 300 V350 H285 V380 M750 350 V380 M750 350 H1215 V380" class="line"/>
<rect x="70" y="380" width="430" height="150" class="story"/>
<text x="105" y="420" class="title">STORY — Create Order API</text>
<text x="105" y="458" class="body">PLAT-101</text><text x="105" y="490" class="body">As a customer, I can submit an order</text>

<rect x="535" y="380" width="430" height="150" class="story"/>
<text x="570" y="420" class="title">STORY — Track Order Status</text>
<text x="570" y="458" class="body">PLAT-102</text><text x="570" y="490" class="body">As a customer, I can view order status</text>

<rect x="1000" y="380" width="430" height="150" class="story"/>
<text x="1035" y="420" class="title">STORY — Deploy Order Service</text>
<text x="1035" y="458" class="body">PLAT-103</text><text x="1035" y="490" class="body">Run the service on AWS EKS</text>

<!-- children -->
<path d="M285 530 V585 M750 530 V585 M1215 530 V585" class="line"/>
<rect x="70" y="585" width="430" height="235" class="card"/>
<text x="105" y="625" class="title">Sub-tasks</text>
<rect x="100" y="650" width="370" height="42" class="subtask"/><text x="120" y="678" class="body">Implement REST endpoint</text>
<rect x="100" y="705" width="370" height="42" class="subtask"/><text x="120" y="733" class="body">Add validation and tests</text>
<rect x="100" y="760" width="370" height="42" class="subtask"/><text x="120" y="788" class="body">Document API contract</text>

<rect x="535" y="585" width="430" height="235" class="card"/>
<text x="570" y="625" class="title">Tasks &amp; defect tracking</text>
<rect x="565" y="650" width="370" height="42" class="task"/><text x="585" y="678" class="body">Integrate order status lookup</text>
<rect x="565" y="705" width="370" height="42" class="bug"/><text x="585" y="733" class="body">BUG — Incorrect status response</text>
<rect x="565" y="760" width="370" height="42" class="subtask"/><text x="585" y="788" class="body">Add regression test</text>

<rect x="1000" y="585" width="430" height="235" class="card"/>
<text x="1035" y="625" class="title">Engineering tasks</text>
<rect x="1030" y="650" width="370" height="42" class="task"/><text x="1050" y="678" class="body">Create Docker build pipeline</text>
<rect x="1030" y="705" width="370" height="42" class="task"/><text x="1050" y="733" class="body">Create Helm deployment chart</text>
<rect x="1030" y="760" width="370" height="42" class="task"/><text x="1050" y="788" class="body">Configure EKS health checks</text>

<text x="70" y="865" class="sub">Note: Jira hierarchy and parent-child relationships depend on the configured project type and issue type scheme.</text>
</svg>