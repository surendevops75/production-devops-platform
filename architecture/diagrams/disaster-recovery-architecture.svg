<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#edf3fb"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183153" flood-opacity=".12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
  <style>
  .h{font:700 30px Arial,sans-serif;fill:#14233b}.sub{font:16px Arial,sans-serif;fill:#52627a}
  .head{font:700 19px Arial,sans-serif;fill:#172b4d}.txt{font:15px Arial,sans-serif;fill:#33445d}
  .small{font:13px Arial,sans-serif;fill:#52627a}.white{fill:#fff}.card{fill:#fff;stroke:#d7e1ef;stroke-width:2;rx:18;filter:url(#shadow)}
  .pill{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.5;rx:10}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}
  .icon{font:700 20px Arial,sans-serif;fill:#fff}
  </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="70" y="65" class="h">Disaster Recovery Architecture</text>
<text x="70" y="96" class="sub">Reference design • backup, recovery, validation and controlled service restoration</text>

<!-- strategy strip -->
<rect x="70" y="125" width="1460" height="105" rx="18" fill="#132b4a"/>
<text x="100" y="163" class="white" style="font:700 20px Arial">RECOVERY OBJECTIVES</text>
<text x="100" y="195" class="white" style="font:15px Arial">Define RTO • Define RPO • Identify critical services • Assign owners • Test recovery procedures</text>
<rect x="1030" y="145" width="210" height="58" rx="12" fill="#21466f"/><text x="1050" y="170" class="white" style="font:700 15px Arial">RTO</text><text x="1050" y="190" class="white" style="font:13px Arial">Recovery time target</text>
<rect x="1260" y="145" width="240" height="58" rx="12" fill="#21466f"/><text x="1280" y="170" class="white" style="font:700 15px Arial">RPO</text><text x="1280" y="190" class="white" style="font:13px Arial">Acceptable data loss</text>

<!-- left sources -->
<rect x="70" y="280" width="330" height="275" class="card"/>
<rect x="70" y="280" width="330" height="54" rx="18" fill="url(#blue)"/>
<text x="96" y="315" class="white" style="font:700 19px Arial">1  Production workloads</text>
<rect x="100" y="365" width="270" height="48" class="pill"/><text x="120" y="395" class="txt">Amazon EKS • 21 microservices</text>
<rect x="100" y="428" width="270" height="48" class="pill"/><text x="120" y="458" class="txt">RDS / database workloads</text>
<rect x="100" y="491" width="270" height="42" class="pill"/><text x="120" y="518" class="txt">Helm values • GitOps config</text>

<!-- backup -->
<rect x="475" y="280" width="390" height="275" class="card"/>
<rect x="475" y="280" width="390" height="54" rx="18" fill="#0f766e"/>
<text x="500" y="315" class="white" style="font:700 19px Arial">2  Backup &amp; protection</text>
<rect x="510" y="365" width="320" height="48" rx="10" fill="#ecfdf5" stroke="#99f6e4"/><text x="530" y="395" class="txt">Database snapshots / exports</text>
<rect x="510" y="428" width="320" height="48" rx="10" fill="#ecfdf5" stroke="#99f6e4"/><text x="530" y="458" class="txt">S3 backup storage • retention</text>
<rect x="510" y="491" width="320" height="42" rx="10" fill="#ecfdf5" stroke="#99f6e4"/><text x="530" y="518" class="txt">Versioned IaC &amp; Git repositories</text>

<!-- recovery -->
<rect x="940" y="280" width="590" height="275" class="card"/>
<rect x="940" y="280" width="590" height="54" rx="18" fill="#7c3aed"/>
<text x="965" y="315" class="white" style="font:700 19px Arial">3  Recovery environment</text>
<rect x="980" y="365" width="235" height="65" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/><text x="1000" y="391" class="head">Infrastructure</text><text x="1000" y="414" class="small">Terraform recreation</text>
<rect x="1250" y="365" width="235" height="65" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/><text x="1270" y="391" class="head">Kubernetes</text><text x="1270" y="414" class="small">EKS + Helm + Argo CD</text>
<rect x="980" y="455" width="235" height="65" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/><text x="1000" y="481" class="head">Data restore</text><text x="1000" y="504" class="small">Restore + consistency check</text>
<rect x="1250" y="455" width="235" height="65" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/><text x="1270" y="481" class="head">Traffic validation</text><text x="1270" y="504" class="small">Smoke tests before cutover</text>

<path d="M400 420 H465" class="line"/><path d="M865 420 H930" class="line"/>

<!-- lower workflow -->
<rect x="70" y="630" width="1460" height="270" rx="20" fill="#fff" stroke="#d7e1ef" stroke-width="2" filter="url(#shadow)"/>
<text x="100" y="675" class="head">4  Recovery runbook</text>
<g>
<rect x="100" y="715" width="245" height="120" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
<circle cx="130" cy="747" r="17" fill="#ea580c"/><text x="124" y="754" class="icon">1</text><text x="160" y="752" class="head">Detect &amp; declare</text><text x="120" y="790" class="small">Confirm incident scope</text><text x="120" y="811" class="small">and invoke recovery plan</text>
<path d="M345 775 H380" class="line"/>
<rect x="390" y="715" width="245" height="120" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
<circle cx="420" cy="747" r="17" fill="#2563eb"/><text x="414" y="754" class="icon">2</text><text x="450" y="752" class="head">Provision</text><text x="410" y="790" class="small">Apply Terraform and</text><text x="410" y="811" class="small">restore platform baseline</text>
<path d="M635 775 H670" class="line"/>
<rect x="680" y="715" width="245" height="120" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
<circle cx="710" cy="747" r="17" fill="#16a34a"/><text x="704" y="754" class="icon">3</text><text x="740" y="752" class="head">Restore data</text><text x="700" y="790" class="small">Restore backup and verify</text><text x="700" y="811" class="small">integrity / consistency</text>
<path d="M925 775 H960" class="line"/>
<rect x="970" y="715" width="245" height="120" rx="14" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
<circle cx="1000" cy="747" r="17" fill="#7c3aed"/><text x="994" y="754" class="icon">4</text><text x="1030" y="752" class="head">Deploy &amp; test</text><text x="990" y="790" class="small">Sync workloads; run smoke</text><text x="990" y="811" class="small">and integration tests</text>
<path d="M1215 775 H1250" class="line"/>
<rect x="1260" y="715" width="235" height="120" rx="14" fill="#ecfeff" stroke="#a5f3fc" stroke-width="2"/>
<circle cx="1290" cy="747" r="17" fill="#0891b2"/><text x="1284" y="754" class="icon">5</text><text x="1320" y="752" class="head">Resume service</text><text x="1280" y="790" class="small">Controlled traffic cutover</text><text x="1280" y="811" class="small">monitor and review</text>
</g>
<text x="100" y="870" class="small">Design note: choose backup services, cross-region strategy, replication and failover only after validating workload requirements, cost and account configuration.</text>
</svg>