<g class="head">
 <text x="705" y="230">User Service</text><text x="975" y="230">Product Catalog</text><text x="1245" y="230">Cart Service</text><text x="1515" y="230">Order Service</text>
 <text x="705" y="370">Payment Service</text><text x="975" y="370">Inventory Service</text><text x="1245" y="370">Notification Service</text><text x="1515" y="370">Other Services</text>
</g>
<g class="tiny">
 <text x="705" y="260">Authentication / user profile</text><text x="975" y="260">Products / categories</text><text x="1245" y="260">Cart management</text><text x="1515" y="260">Order lifecycle</text>
 <text x="705" y="400">Payment processing</text><text x="975" y="400">Stock management</text><text x="1245" y="400">Events / messages</text><text x="1515" y="400">Remaining domain services</text>
</g>
<text x="1112" y="485" text-anchor="middle" class="tiny">Each service has its own container image, Deployment, Service, configuration and scaling policy.</text>

<!-- internal communication / policies -->
<rect x="585" y="520" width="1055" height="105" rx="10" fill="#eef5ff" stroke="#6c9bd1" stroke-width="1.5"/>
<text x="1112" y="550" text-anchor="middle" class="head">Service Communication</text>
<text x="1112" y="575" text-anchor="middle" class="body">Synchronous: Kubernetes DNS + ClusterIP Services + HTTP / REST (where implemented)</text>
<text x="1112" y="598" text-anchor="middle" class="body">Asynchronous: publish / consume events through the messaging layer</text>

<!-- health / scaling -->
<rect x="585" y="650" width="1055" height="145" rx="10" fill="#fff" stroke="#7cab7c" stroke-width="1.5"/>
<text x="1112" y="680" text-anchor="middle" class="head">Kubernetes Workload Controls</text>
<g>
 <rect x="620" y="705" width="220" height="60" rx="8" fill="#f2fff2" stroke="#7cab7c"/><text x="730" y="731" text-anchor="middle" class="body">Readiness / Liveness</text><text x="730" y="749" text-anchor="middle" class="tiny">Probe checks</text>
 <rect x="875" y="705" width="220" height="60" rx="8" fill="#f2fff2" stroke="#7cab7c"/><text x="985" y="731" text-anchor="middle" class="body">Requests / Limits</text><text x="985" y="749" text-anchor="middle" class="tiny">CPU and memory</text>
 <rect x="1130" y="705" width="220" height="60" rx="8" fill="#f2fff2" stroke="#7cab7c"/><text x="1240" y="731" text-anchor="middle" class="body">Horizontal Pod Autoscaler</text><text x="1240" y="749" text-anchor="middle" class="tiny">Replica scaling</text>
 <rect x="1385" y="705" width="220" height="60" rx="8" fill="#f2fff2" stroke="#7cab7c"/><text x="1495" y="731" text-anchor="middle" class="body">Rolling Updates</text><text x="1495" y="749" text-anchor="middle" class="tiny">Availability / rollback</text>
</g>

