<rect x="270" y="160" width="220" height="125" rx="12" fill="#fff5e8" stroke="#d69a3a" stroke-width="1.8"/>
<circle cx="380" cy="200" r="25" fill="none" stroke="#7952a3" stroke-width="2.5"/>
<path d="M355 200 H405 M380 175 V225 M363 183 L397 217 M397 183 L363 217" fill="none" stroke="#7952a3" stroke-width="2"/>
<text x="380" y="250" text-anchor="middle" class="head">AWS ALB / Ingress</text>
<text x="380" y="268" text-anchor="middle" class="tiny">Routes requests to services</text>

<!-- EKS boundary -->
<rect x="540" y="105" width="1135" height="735" rx="16" fill="#f4fbf4" stroke="#388b45" stroke-width="2.2"/>
<g transform="translate(565 120)"><path d="M25 0 L48 13 V40 L25 53 L2 40 V13Z" fill="#438b45"/><path d="M25 9 L39 17 V35 L25 44 L11 35 V17Z" fill="none" stroke="#fff" stroke-width="2"/></g>
<text x="630" y="155" class="section">Amazon EKS — Application Namespace</text>
<text x="1640" y="155" text-anchor="end" class="tiny">21 microservices | separate Deployments and Kubernetes Services</text>

