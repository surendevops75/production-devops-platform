<rect width="100%" height="100%" fill="#fff"/>
<text x="850" y="42" text-anchor="middle" class="title">production-devops-platform — Microservices Architecture</text>
<text x="850" y="68" text-anchor="middle" class="sub">Client request flow | 21 independently deployable services | data and asynchronous messaging</text>

<!-- client -->
<rect x="25" y="140" width="190" height="165" rx="12" fill="#f7faff" stroke="#6c9bd1" stroke-width="1.8"/>
<circle cx="120" cy="188" r="22" fill="none" stroke="#2874c8" stroke-width="2.5"/>
<path d="M78 257 Q80 218 120 218 Q160 218 162 257" fill="none" stroke="#2874c8" stroke-width="2.5"/>
