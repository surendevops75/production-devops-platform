<rect x="25" y="900" width="1650" height="165" rx="14" fill="#fbf7ff" stroke="#7952a3" stroke-width="1.8"/>
<text x="850" y="930" text-anchor="middle" class="section">Data &amp; Messaging Layer — Integration Boundaries</text>
<g>
 <rect x="75" y="955" width="330" height="82" rx="9" fill="#fff" stroke="#d49a45" stroke-width="1.5"/>
 <g transform="translate(100 972)" fill="none" stroke="#c58b28" stroke-width="2.5"><ellipse cx="25" cy="8" rx="23" ry="8"/><path d="M2 8 V42 Q25 57 48 42 V8 M2 25 Q25 40 48 25"/></g>
