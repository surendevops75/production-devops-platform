<g>
 <rect x="585" y="190" width="245" height="112" rx="10" fill="#fff" stroke="#7cab7c" stroke-width="1.5"/>
 <rect x="855" y="190" width="245" height="112" rx="10" fill="#fff" stroke="#7cab7c" stroke-width="1.5"/>
