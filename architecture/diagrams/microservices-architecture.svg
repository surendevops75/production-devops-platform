 <rect x="455" y="955" width="330" height="82" rx="9" fill="#fff" stroke="#d49a45" stroke-width="1.5"/>
 <g transform="translate(485 972)" fill="none" stroke="#c92f45" stroke-width="2.5"><path d="M2 18 Q25 -2 48 18 Q25 38 2 18Z"/><path d="M25 18 V48 M10 35 Q25 48 40 35"/></g>
 <text x="660" y="987" text-anchor="middle" class="head">Redis</text><text x="660" y="1008" text-anchor="middle" class="tiny">Caching / fast lookup</text>
 <rect x="835" y="955" width="330" height="82" rx="9" fill="#fff" stroke="#d49a45" stroke-width="1.5"/>
 <g transform="translate(865 972)" fill="none" stroke="#2874c8" stroke-width="2.5"><circle cx="25" cy="25" r="22"/><path d="M3 25 H47 M25 3 V47 M10 10 L40 40 M40 10 L10 40"/></g>
 <text x="1040" y="987" text-anchor="middle" class="head">RabbitMQ</text><text x="1040" y="1008" text-anchor="middle" class="tiny">Message queueing</text>
 <rect x="1215" y="955" width="400" height="82" rx="9" fill="#fff" stroke="#d49a45" stroke-width="1.5"/>
 <g transform="translate(1245 972)" fill="none" stroke="#2874c8" stroke-width="2.5"><path d="M0 5 H48 M0 25 H48 M0 45 H48"/><circle cx="10" cy="5" r="5" fill="#fff"/><circle cx="34" cy="25" r="5" fill="#fff"/><circle cx="20" cy="45" r="5" fill="#fff"/></g>
 <text x="1450" y="987" text-anchor="middle" class="head">Apache Kafka</text><text x="1450" y="1008" text-anchor="middle" class="tiny">Event streaming</text>
</g>

