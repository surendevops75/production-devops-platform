<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#193454" flood-opacity=".12"/></filter>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
 <style>
 .title{font:700 30px Arial;fill:#14233b}.sub{font:16px Arial;fill:#53647c}.h{font:700 19px Arial;fill:#172b4d}.t{font:15px Arial;fill:#34465f}.s{font:13px Arial;fill:#52627a}.w{fill:#fff}
 .card{fill:#fff;stroke:#d6e1ef;stroke-width:2;rx:17;filter:url(#sh)}.pill{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.5;rx:10}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arr)}
 </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="65" y="65" class="title">AWS Identity and Access Management Architecture</text>
<text x="65" y="96" class="sub">Human access • CI/CD federation • EKS workload identity • least-privilege permissions</text>
<rect x="65" y="130" width="1470" height="88" rx="18" fill="#142d4d"/>
<text x="95" y="167" class="w" style="font:700 20px Arial">IAM SECURITY MODEL</text>
<text x="95" y="195" class="w" style="font:15px Arial">Authenticate identities • authorize specific actions • scope resources • avoid long-lived keys • review and audit access</text>

<!-- human -->
<rect x="65" y="285" width="320" height="270" class="card"/>
<rect x="65" y="285" width="320" height="55" rx="17" fill="#1d4ed8"/>
<text x="95" y="320" class="w" style="font:700 19px Arial">1  Human identities</text>
<circle cx="130" cy="395" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><path d="M98 448c4-24 60-24 64 0" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="185" y="397" class="h">Engineers / operators</text><text x="185" y="422" class="s">Federated sign-in / MFA*</text>
<rect x="100" y="475" width="250" height="48" class="pill"/><text x="120" y="505" class="t">Role-based access</text>

<!-- cicd -->
<rect x="455" y="285" width="320" height="270" class="card"/>
<rect x="455" y="285" width="320" height="55" rx="17" fill="#7c3aed"/>
<text x="485" y="320" class="w" style="font:700 19px Arial">2  CI/CD identity</text>
<circle cx="515" cy="395" r="23" fill="#24292f"/><path d="M504 389l11-7 11 7v13l-11 7-11-7z" fill="none" stroke="#fff" stroke-width="2"/>
<text x="555" y="394" class="h">GitHub Actions</text><text x="555" y="420" class="s">OIDC identity token</text>
<rect x="490" y="475" width="250" height="48" class="pill"/><text x="510" y="505" class="t">Assume deployment role</text>

<!-- IAM -->
<rect x="845" y="285" width="330" height="270" class="card"/>
<rect x="845" y="285" width="330" height="55" rx="17" fill="#b45309"/>
<text x="875" y="320" class="w" style="font:700 19px Arial">3  AWS IAM</text>
<path d="M900 390l34-18 34 18v37c0 25-34 43-34 43s-34-18-34-43z" fill="#ffedd5" stroke="#d97706" stroke-width="2"/>
<circle cx="934" cy="410" r="8" fill="none" stroke="#b45309" stroke-width="3"/><path d="M934 418v13" stroke="#b45309" stroke-width="3"/>
<text x="985" y="399" class="h">Roles &amp; policies</text><text x="985" y="425" class="s">Trust + permission policies</text>
<rect x="880" y="475" width="260" height="48" class="pill"/><text x="900" y="505" class="t">STS temporary credentials</text>

<!-- AWS targets -->
<rect x="1245" y="285" width="290" height="270" class="card"/>
<rect x="1245" y="285" width="290" height="55" rx="17" fill="#0f766e"/>
<text x="1275" y="320" class="w" style="font:700 19px Arial">4  AWS resources</text>
<rect x="1280" y="375" width="220" height="50" class="pill"/><text x="1300" y="406" class="t">S3 / Terraform state</text>
<rect x="1280" y="440" width="220" height="50" class="pill"/><text x="1300" y="471" class="t">ECR / infrastructure</text>
<text x="1280" y="525" class="s">Only explicitly authorized actions</text>

<path d="M385 415H445" class="line"/><path d="M775 415H835" class="line"/><path d="M1175 415H1235" class="line"/>

<!-- EKS identity -->
<rect x="65" y="635" width="700" height="235" class="card"/>
<rect x="65" y="635" width="700" height="55" rx="17" fill="#334155"/>
<text x="95" y="670" class="w" style="font:700 19px Arial">5  EKS workload identity</text>
<rect x="105" y="725" width="265" height="85" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="130" y="758" class="h">Kubernetes ServiceAccount</text><text x="130" y="785" class="s">Assigned to application pod</text>
<rect x="420" y="725" width="300" height="85" rx="12" fill="#fff7ed" stroke="#fed7aa"/><text x="445" y="758" class="h">IRSA / EKS Pod Identity*</text><text x="445" y="785" class="s">Maps workload to IAM role</text>
<path d="M370 768H410" class="line"/>

<!-- RBAC -->
<rect x="845" y="635" width="690" height="235" class="card"/>
<rect x="845" y="635" width="690" height="55" rx="17" fill="#0f766e"/>
<text x="875" y="670" class="w" style="font:700 19px Arial">6  Kubernetes authorization</text>
<rect x="885" y="725" width="270" height="85" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/><text x="910" y="758" class="h">RBAC Roles / Bindings</text><text x="910" y="785" class="s">Namespace-scoped permissions</text>
<rect x="1190" y="725" width="300" height="85" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/><text x="1215" y="758" class="h">ClusterRoles / Bindings</text><text x="1215" y="785" class="s">Cluster-wide permissions</text>
<text x="875" y="840" class="s">Keep cluster-admin access rare, controlled and auditable.</text>

<path d="M600 555V610H565V715" class="line"/>
<path d="M1170 555V600H1015V715" class="line"/>
<text x="65" y="930" class="s">* Select federation, MFA, IRSA or EKS Pod Identity according to actual account and cluster configuration. IAM and Kubernetes RBAC control different permission domains.</text>
</svg>