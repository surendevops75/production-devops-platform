<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf1fa"/></linearGradient>
 <linearGradient id="aws" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/></linearGradient>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#193454" flood-opacity=".12"/></filter>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
 <style>
 .title{font:700 30px Arial;fill:#14233b}.sub{font:16px Arial;fill:#53647c}.h{font:700 19px Arial;fill:#172b4d}.t{font:15px Arial;fill:#34465f}.s{font:13px Arial;fill:#52627a}.w{fill:#fff}
 .card{fill:#fff;stroke:#d6e1ef;stroke-width:2;rx:17;filter:url(#sh)}.pill{fill:#f1f6fd;stroke:#cbd9eb;stroke-width:1.5;rx:10}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arr)}
 </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="65" y="65" class="title">AWS Network Architecture</text>
<text x="65" y="96" class="sub">Reference design for secure ingress, private workloads, controlled egress and service communication</text>

<rect x="65" y="130" width="1470" height="105" rx="18" fill="#142d4d"/>
<text x="95" y="169" class="w" style="font:700 20px Arial">NETWORK SECURITY PRINCIPLES</text>
<text x="95" y="200" class="w" style="font:15px Arial">Public exposure only at approved entry points • Private application workloads • Least-privilege traffic rules • Explicit egress controls</text>

<!-- internet and edge -->
<rect x="65" y="300" width="250" height="190" class="card"/>
<circle cx="115" cy="355" r="27" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
<path d="M88 355h54M115 328c-18 18-18 36 0 54M115 328c18 18 18 36 0 54M91 342h48M91 368h48" stroke="#2563eb" stroke-width="2" fill="none"/>
<text x="160" y="352" class="h">Internet</text><text x="160" y="377" class="s">External clients</text>
<rect x="95" y="415" width="190" height="45" class="pill"/><text x="115" y="443" class="t">HTTPS / TLS</text>

<rect x="375" y="300" width="270" height="190" class="card"/>
<rect x="405" y="335" width="210" height="55" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<path d="M430 365h30l10-15 10 30 10-15h25" stroke="#ea580c" stroke-width="3" fill="none"/>
<text x="505" y="369" class="h">ALB / Ingress</text>
<text x="405" y="425" class="t">Public subnet entry point</text>
<text x="405" y="451" class="s">TLS termination and routing</text>

<path d="M315 395H365" class="line"/>

<!-- VPC -->
<rect x="700" y="270" width="835" height="560" rx="24" fill="#f0f7ff" stroke="#60a5fa" stroke-width="3"/>
<rect x="725" y="285" width="260" height="45" rx="12" fill="#1d4ed8"/>
<text x="750" y="314" class="w" style="font:700 19px Arial">AWS VPC • CIDR range</text>
<text x="1010" y="313" class="s">Example layout — choose non-overlapping CIDRs</text>

<!-- public subnet -->
<rect x="735" y="360" width="350" height="175" rx="17" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="760" y="393" class="h">Public subnets</text>
<text x="760" y="418" class="s">Across availability zones</text>
<rect x="760" y="445" width="135" height="60" rx="10" fill="#fff" stroke="#fdba74"/><text x="775" y="470" class="t">ALB</text><text x="775" y="491" class="s">Ingress</text>
<rect x="920" y="445" width="135" height="60" rx="10" fill="#fff" stroke="#fdba74"/><text x="935" y="470" class="t">NAT GW</text><text x="935" y="491" class="s">Egress*</text>

<!-- private app -->
<rect x="1110" y="360" width="395" height="260" rx="17" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="1135" y="393" class="h">Private application subnets</text>
<text x="1135" y="418" class="s">EKS worker nodes and workloads</text>
<rect x="1140" y="445" width="335" height="145" rx="13" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
<polygon points="1170,480 1185,455 1215,455 1230,480 1215,505 1185,505" fill="#326ce5"/>
<text x="1179" y="486" class="w" style="font:700 13px Arial">K8s</text>
<text x="1250" y="477" class="h">Amazon EKS</text>
<text x="1250" y="502" class="s">21 microservices</text>
<text x="1165" y="550" class="s">ClusterIP • Kubernetes DNS • NetworkPolicies*</text>

<!-- private data -->
<rect x="735" y="655" width="770" height="135" rx="17" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
<text x="760" y="689" class="h">Private data / dependency layer</text>
<rect x="760" y="710" width="205" height="55" rx="10" fill="#fff" stroke="#86efac"/><text x="780" y="744" class="t">RDS / Database</text>
<rect x="990" y="710" width="205" height="55" rx="10" fill="#fff" stroke="#86efac"/><text x="1010" y="744" class="t">Redis / Cache</text>
<rect x="1220" y="710" width="255" height="55" rx="10" fill="#fff" stroke="#86efac"/><text x="1240" y="744" class="t">RabbitMQ / Kafka*</text>

<!-- flows -->
<path d="M645 395H690" class="line"/>
<path d="M1085 475H1100" class="line"/>
<path d="M1300 620V645" class="line"/>
<path d="M1000 535V645" class="line"/>
<text x="75" y="545" class="s">Inbound requests</text>

<!-- controls -->
<rect x="65" y="610" width="580" height="220" class="card"/>
<text x="95" y="650" class="h">Network controls</text>
<rect x="95" y="675" width="240" height="48" class="pill"/><text x="115" y="705" class="t">Security Groups</text>
<rect x="365" y="675" width="240" height="48" class="pill"/><text x="385" y="705" class="t">Network ACLs</text>
<rect x="95" y="740" width="240" height="48" class="pill"/><text x="115" y="770" class="t">Kubernetes NetworkPolicies*</text>
<rect x="365" y="740" width="240" height="48" class="pill"/><text x="385" y="770" class="t">Private DNS / Route 53*</text>

<text x="700" y="880" class="s">* Optional / configuration-dependent components. Confirm actual subnet layout, NAT, DNS, security rules and data services before describing them as deployed.</text>
<text x="65" y="935" class="s">Design guidance: use multiple Availability Zones for resilience; restrict inbound ports; allow only required service-to-service and data-layer traffic.</text>
</svg>