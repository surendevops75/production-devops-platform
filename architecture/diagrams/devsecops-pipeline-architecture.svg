<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf1fa"/></linearGradient>
 <linearGradient id="sec" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f9b79"/><stop offset="1" stop-color="#08765e"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183153" flood-opacity=".12"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58718d"/></marker>
 <style>
 .title{font:700 34px Arial;fill:#10233f}.sub{font:16px Arial;fill:#53677f}.head{font:700 18px Arial;fill:#142b49}.txt{font:14px Arial;fill:#405873}.small{font:12px Arial;fill:#5c718a}
 .card{fill:#fff;stroke:#d7e2ef;stroke-width:1.5;rx:16;filter:url(#shadow)}.line{stroke:#58718d;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
 </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="65" y="70" class="title">DevSecOps Pipeline Architecture</text>
<text x="65" y="103" class="sub">Shift security left, enforce quality gates, publish trusted images, and deploy through GitOps</text>

<rect x="55" y="145" width="1490" height="450" rx="24" fill="#f0f5fc" stroke="#d5e1ef"/>
<text x="85" y="185" class="head">Continuous integration security gates</text>

<!-- source -->
<rect x="80" y="235" width="205" height="245" class="card"/>
<circle cx="132" cy="286" r="27" fill="#172b4d"/>
<path d="M120 286l12-12 12 12-12 12z M132 274v24 M120 286h24" stroke="#fff" stroke-width="3" fill="none"/>
<text x="174" y="284" class="head">GitHub</text>
<text x="105" y="340" class="txt">Pull request</text>
<text x="105" y="368" class="txt">Branch protection</text>
<text x="105" y="396" class="txt">Source changes</text>
<text x="105" y="424" class="txt">Workflow trigger</text>

<!-- build -->
<rect x="325" y="235" width="205" height="245" class="card"/>
<rect x="360" y="260" width="52" height="52" rx="10" fill="#2563eb"/>
<path d="M373 286h26 M386 273v26" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text x="425" y="284" class="head">Build</text>
<text x="350" y="340" class="txt">Checkout</text>
<text x="350" y="368" class="txt">Dependency install</text>
<text x="350" y="396" class="txt">Unit tests</text>
<text x="350" y="424" class="txt">Build artifact</text>

<!-- code security -->
<rect x="570" y="235" width="230" height="245" class="card"/>
<path d="M625 260l29 10v25c0 20-15 31-29 39-14-8-29-19-29-39v-25z" fill="url(#sec)"/>
<path d="M612 294l10 10 18-21" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
<text x="670" y="284" class="head">Code security</text>
<text x="595" y="340" class="txt">SonarQube analysis</text>
<text x="595" y="368" class="txt">Dependency scanning</text>
<text x="595" y="396" class="txt">Secret detection</text>
<text x="595" y="424" class="txt">Quality / security gate</text>

<!-- container -->
<rect x="840" y="235" width="220" height="245" class="card"/>
<rect x="875" y="260" width="55" height="48" rx="8" fill="#2496ed"/>
<path d="M875 276h55 M892 260v16 M910 260v16 M875 291h55" stroke="#fff" stroke-width="2.5" fill="none"/>
<text x="945" y="284" class="head">Container</text>
<text x="865" y="340" class="txt">Docker build</text>
<text x="865" y="368" class="txt">Trivy image scan</text>
<text x="865" y="396" class="txt">Tag / provenance</text>
<text x="865" y="424" class="txt">Publish approved image</text>

<!-- registry -->
<rect x="1100" y="235" width="190" height="245" class="card"/>
<path d="M1140 265h50v42h-50z M1148 256h50v42" fill="#e98b27" stroke="#b86a17" stroke-width="2"/>
<text x="1200" y="284" class="head">Amazon ECR</text>
<text x="1125" y="340" class="txt">Image repository</text>
<text x="1125" y="368" class="txt">Immutable version</text>
<text x="1125" y="396" class="txt">Access controls</text>
<text x="1125" y="424" class="txt">Pull by EKS</text>

<!-- deploy -->
<rect x="1330" y="235" width="180" height="245" class="card"/>
<polygon points="1385,258 1410,272 1410,300 1385,314 1360,300 1360,272" fill="#326ce5"/>
<text x="1385" y="294" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">K8s</text>
<text x="1440" y="284" class="head">EKS</text>
<text x="1355" y="340" class="txt">Argo CD</text>
<text x="1355" y="368" class="txt">Helm deployment</text>
<text x="1355" y="396" class="txt">Rollout checks</text>
<text x="1355" y="424" class="txt">Health validation</text>

<path d="M285 355H315" class="line"/><path d="M530 355H560" class="line"/><path d="M800 355H830" class="line"/><path d="M1060 355H1090" class="line"/><path d="M1290 355H1320" class="line"/>

<!-- fail gate -->
<rect x="570" y="505" width="490" height="58" rx="13" fill="#fff4ee" stroke="#f0d2c4"/>
<text x="815" y="540" text-anchor="middle" class="head" fill="#9a3412">Failed gate → stop pipeline → remediate → rescan</text>
<path d="M685 480V495" stroke="#c15b32" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M950 480V495" stroke="#c15b32" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

<!-- lower -->
<rect x="55" y="635" width="700" height="285" rx="22" fill="#fff" stroke="#d7e2ef" filter="url(#shadow)"/>
<text x="85" y="680" class="head">Security tools and responsibilities</text>
<g class="txt">
<text x="95" y="730">• SonarQube — source code quality and security analysis</text>
<text x="95" y="770">• Trivy — container image and filesystem vulnerability scanning</text>
<text x="95" y="810">• Dependency / secret scanners — identify risky packages and leaks</text>
<text x="95" y="850">• IAM OIDC — short-lived AWS authentication for CI</text>
<text x="95" y="890">• Argo CD — deploy approved desired state from Git</text>
</g>

<rect x="800" y="635" width="745" height="285" rx="22" fill="#fff" stroke="#d7e2ef" filter="url(#shadow)"/>
<text x="830" y="680" class="head">Promotion and production safeguards</text>
<g>
<rect x="845" y="725" width="145" height="78" rx="13" fill="#edf4ff" stroke="#d2e2f8"/>
<text x="917" y="758" text-anchor="middle" class="head">Scan</text><text x="917" y="783" text-anchor="middle" class="small">policy evaluation</text>
<path d="M990 764H1015" class="line"/>
<rect x="1025" y="725" width="145" height="78" rx="13" fill="#edf4ff" stroke="#d2e2f8"/>
<text x="1097" y="758" text-anchor="middle" class="head">Approve</text><text x="1097" y="783" text-anchor="middle" class="small">promotion control</text>
<path d="M1170 764H1195" class="line"/>
<rect x="1205" y="725" width="145" height="78" rx="13" fill="#edf4ff" stroke="#d2e2f8"/>
<text x="1277" y="758" text-anchor="middle" class="head">Deploy</text><text x="1277" y="783" text-anchor="middle" class="small">GitOps update</text>
<path d="M1350 764H1375" class="line"/>
<rect x="1385" y="725" width="125" height="78" rx="13" fill="#edf8f3" stroke="#cde8d9"/>
<text x="1447" y="758" text-anchor="middle" class="head">Verify</text><text x="1447" y="783" text-anchor="middle" class="small">runtime health</text>
</g>
<text x="845" y="850" class="txt">Define severity thresholds, exception ownership, retention and audit evidence.</text>
<text x="845" y="880" class="small">Promote the same tested image digest across environments whenever possible.</text>
<text x="65" y="965" class="small">Conceptual pipeline: configure actual scanners, thresholds, approval gates, OIDC permissions and deployment ownership in the repository.</text>
</svg>