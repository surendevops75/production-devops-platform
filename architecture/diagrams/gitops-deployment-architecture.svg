.p{fill:none;stroke:#7952a3;stroke-width:2.6;marker-end:url(#p)}.g{fill:none;stroke:#388b45;stroke-width:2.6;marker-end:url(#g)}.o{fill:none;stroke:#e87524;stroke-width:2.6;marker-end:url(#o)}
</style></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="850" y="42" text-anchor="middle" class="title">production-devops-platform — GitOps Deployment Architecture</text>
<text x="850" y="68" text-anchor="middle" class="sub">Git as desired state | Helm packaging | Argo CD reconciliation | Amazon EKS workloads</text>

<!-- GitHub source -->
<rect x="30" y="145" width="235" height="220" rx="13" fill="#fff8f1" stroke="#e87524" stroke-width="1.8"/>
<circle cx="80" cy="190" r="22" fill="#24292f"/><path d="M68 193 Q66 179 79 177 Q93 176 93 190 L90 200 L84 196 L82 206 L75 206 L75 196 L69 200Z" fill="#fff"/>
<text x="150" y="196" class="section">GitHub</text>
<rect x="55" y="235" width="185" height="75" rx="8" fill="#fff" stroke="#e87524"/>
<text x="147" y="263" text-anchor="middle" class="head">Application Repo</text><text x="147" y="284" text-anchor="middle" class="tiny">Source code / Dockerfile</text>
<text x="147" y="340" text-anchor="middle" class="tiny">CI publishes image to ECR</text>

<!-- ECR -->
<rect x="30" y="430" width="235" height="155" rx="13" fill="#fff8f1" stroke="#e87524" stroke-width="1.8"/>
<g transform="translate(65 460)" fill="none" stroke="#df6c1c" stroke-width="3"><path d="M0 8 L27 0 L54 8 V42 L27 54 L0 42Z M0 8 L27 21 L54 8 M27 21 V54"/></g>
<text x="165" y="483" class="head">Amazon ECR</text><text x="165" y="505" class="tiny">Versioned images</text><text x="147" y="555" text-anchor="middle" class="tiny">Image tag / digest</text>

<!-- GitOps repository -->
<rect x="330" y="105" width="390" height="500" rx="15" fill="#faf7ff" stroke="#7952a3" stroke-width="2"/>
<path d="M365 145 L388 132 L411 145 V173 L388 186 L365 173Z" fill="none" stroke="#7952a3" stroke-width="2.5"/>
<text x="530" y="165" text-anchor="middle" class="section">GitOps Repository</text>
<text x="525" y="205" text-anchor="middle" class="tiny">Desired state for application delivery</text>
<rect x="365" y="235" width="320" height="80" rx="9" fill="#fff" stroke="#9275b5"/>
<path d="M390 254 H425 V290 H390Z M397 262 H418 M397 272 H418 M397 282 H414" fill="none" stroke="#7952a3" stroke-width="2"/>
<text x="555" y="266" text-anchor="middle" class="head">Helm Charts</text><text x="555" y="289" text-anchor="middle" class="tiny">Templates / Kubernetes resources</text>
<rect x="365" y="335" width="320" height="80" rx="9" fill="#fff" stroke="#9275b5"/>
<path d="M390 354 H425 V390 H390Z M397 362 H418 M397 372 H418 M397 382 H414" fill="none" stroke="#7952a3" stroke-width="2"/>
<text x="555" y="366" text-anchor="middle" class="head">Environment Values</text><text x="555" y="389" text-anchor="middle" class="tiny">dev / qa / staging / prod</text>
<rect x="365" y="435" width="320" height="80" rx="9" fill="#fff" stroke="#9275b5"/>
<circle cx="407" cy="475" r="17" fill="none" stroke="#7952a3" stroke-width="2"/><path d="M399 475 L405 481 L416 467" fill="none" stroke="#7952a3" stroke-width="2.5"/>
<text x="555" y="466" text-anchor="middle" class="head">Reviewed Git Changes</text><text x="555" y="489" text-anchor="middle" class="tiny">Pull request / approval / merge</text>
<text x="525" y="565" text-anchor="middle" class="tiny">Git is the source of truth for desired state</text>

<!-- Argo -->
<rect x="790" y="105" width="340" height="500" rx="15" fill="#f7f2fc" stroke="#7952a3" stroke-width="2"/>
<circle cx="845" cy="160" r="23" fill="#7952a3"/><path d="M833 160 Q845 139 857 160 Q845 181 833 160Z" fill="none" stroke="#fff" stroke-width="2"/>
<text x="970" y="166" text-anchor="middle" class="section">Argo CD</text>
<rect x="825" y="225" width="270" height="65" rx="8" fill="#fff" stroke="#9275b5"/>
<text x="960" y="252" text-anchor="middle" class="head">Repo Server</text><text x="960" y="273" text-anchor="middle" class="tiny">Fetch / render Helm charts</text>
<rect x="825" y="315" width="270" height="65" rx="8" fill="#fff" stroke="#9275b5"/>
<text x="960" y="342" text-anchor="middle" class="head">Application Controller</text><text x="960" y="363" text-anchor="middle" class="tiny">Compare desired vs live state</text>
<rect x="825" y="405" width="270" height="65" rx="8" fill="#fff" stroke="#9275b5"/>
<text x="960" y="432" text-anchor="middle" class="head">Sync &amp; Health Status</text><text x="960" y="453" text-anchor="middle" class="tiny">Automated / manual sync policy</text>
<rect x="825" y="495" width="270" height="65" rx="8" fill="#fff" stroke="#9275b5"/>
<text x="960" y="522" text-anchor="middle" class="head">Drift Detection</text><text x="960" y="543" text-anchor="middle" class="tiny">Reconciliation / self-heal if enabled</text>

<!-- EKS -->
<rect x="1200" y="105" width="465" height="735" rx="16" fill="#f2faf2" stroke="#388b45" stroke-width="2"/>
<g transform="translate(1230 125)"><path d="M25 0 L48 13 V40 L25 53 L2 40 V13Z" fill="#438b45"/><path d="M25 9 L39 17 V35 L25 44 L11 35 V17Z" fill="none" stroke="#fff" stroke-width="2"/></g>
<text x="1390" y="160" text-anchor="middle" class="section">Amazon EKS</text>
<rect x="1235" y="205" width="395" height="90" rx="9" fill="#fff" stroke="#7cab7c"/>
<text x="1432" y="240" text-anchor="middle" class="head">Kubernetes API</text><text x="1432" y="263" text-anchor="middle" class="tiny">Receives desired resources from Argo CD</text>
<rect x="1235" y="325" width="395" height="105" rx="9" fill="#fff" stroke="#7cab7c"/>
<text x="1432" y="360" text-anchor="middle" class="head">Helm-managed Workloads</text><text x="1432" y="384" text-anchor="middle" class="tiny">Deployments • Services • ConfigMaps</text><text x="1432" y="405" text-anchor="middle" class="tiny">HPA • Ingress • ServiceAccounts</text>
<rect x="1235" y="460" width="395" height="100" rx="9" fill="#fff" stroke="#7cab7c"/>
<text x="1432" y="495" text-anchor="middle" class="head">21 Microservices</text><text x="1432" y="519" text-anchor="middle" class="tiny">Pods on private worker nodes</text><text x="1432" y="539" text-anchor="middle" class="tiny">Independent rollout and scaling</text>
<rect x="1235" y="590" width="395" height="85" rx="9" fill="#fff" stroke="#7cab7c"/>
<text x="1432" y="623" text-anchor="middle" class="head">Runtime Validation</text><text x="1432" y="647" text-anchor="middle" class="tiny">Pod readiness • rollout • service health</text>
<rect x="1235" y="705" width="395" height="85" rx="9" fill="#fff" stroke="#7cab7c"/>
<text x="1432" y="738" text-anchor="middle" class="head">Rollback / Recovery</text><text x="1432" y="762" text-anchor="middle" class="tiny">Revert Git change or restore prior image ref</text>

<!-- GitOps lifecycle panel -->
<rect x="30" y="650" width="1100" height="390" rx="15" fill="#fbfcfe" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="580" y="690" text-anchor="middle" class="section">GitOps Operating Model</text>
<g>
<rect x="65" y="730" width="225" height="125" rx="10" fill="#fff" stroke="#6c9bd1"/>
<text x="177" y="765" text-anchor="middle" class="head">1. Build Artifact</text><text x="177" y="792" text-anchor="middle" class="body">CI builds and scans image</text><text x="177" y="815" text-anchor="middle" class="tiny">Push immutable version to ECR</text>
<rect x="330" y="730" width="225" height="125" rx="10" fill="#fff" stroke="#9275b5"/>
<text x="442" y="765" text-anchor="middle" class="head">2. Update Desired State</text><text x="442" y="792" text-anchor="middle" class="body">Commit image reference to Git</text><text x="442" y="815" text-anchor="middle" class="tiny">Review and approve PR</text>
<rect x="595" y="730" width="225" height="125" rx="10" fill="#fff" stroke="#9275b5"/>
<text x="707" y="765" text-anchor="middle" class="head">3. Reconcile</text><text x="707" y="792" text-anchor="middle" class="body">Argo CD compares Git and cluster</text><text x="707" y="815" text-anchor="middle" class="tiny">Sync when policy permits</text>
<rect x="860" y="730" width="225" height="125" rx="10" fill="#fff" stroke="#7cab7c"/>
<text x="972" y="765" text-anchor="middle" class="head">4. Verify</text><text x="972" y="792" text-anchor="middle" class="body">Check health and rollout</text><text x="972" y="815" text-anchor="middle" class="tiny">Monitor application behavior</text>
</g>
<path d="M290 792 H330" class="p"/><path d="M555 792 H595" class="p"/><path d="M820 792 H860" class="g"/>
<rect x="65" y="890" width="1020" height="105" rx="10" fill="#f5f0fb" stroke="#9275b5"/>
<text x="575" y="923" text-anchor="middle" class="head">Important GitOps Principles</text>
<text x="575" y="951" text-anchor="middle" class="body">Git is the source of truth • Use pull requests for production changes • Avoid manual changes to Git-managed resources</text>
<text x="575" y="974" text-anchor="middle" class="body">Use immutable image references • Separate environment values • Review Argo CD sync and health status</text>

<!-- arrows -->
<path d="M265 265 H330" class="o"/>
<path d="M265 500 H300 V475 H330" class="o"/>
<text x="295" y="455" class="tiny">Image digest update</text>
<path d="M720 270 H790" class="p"/><text x="755" y="253" text-anchor="middle" class="tiny">Git watch</text>
<path d="M1130 345 H1200" class="p"/><text x="1165" y="328" text-anchor="middle" class="tiny">Sync</text>
<path d="M1432 560 V590" class="g"/><path d="M1432 675 V705" class="g"/>
<path d="M1200 250 H1165 V920 H1085" class="g" stroke-dasharray="6 4"/>
<text x="1145" y="900" class="tiny">Cluster state feedback</text>
<text x="850" y="1030" text-anchor="middle" class="tiny">Target GitOps design. Automated sync, pruning, self-heal, approvals and promotion policies must be explicitly configured.</text>
</svg>