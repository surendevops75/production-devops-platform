<path d="M1540 360 V535" class="arrow"/>
<path d="M1540 710 V820 H1450 V840" class="arrow"/>
<path d="M1160 710 V820 H900 V840" class="arrow"/>
<path d="M350 935 H250 V780 H100" class="arrow dash"/>
<text x="85" y="805" class="small">Feedback into engineering backlog</text>
<text x="970" y="1080" class="small">*Use only the notification integrations configured in your environment.</text>
</svg>