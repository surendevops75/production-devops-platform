<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf1fa"/></linearGradient>
 <linearGradient id="ops" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#1e40af"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183153" flood-opacity=".12"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58718d"/></marker>
 <style>
 .title{font:700 34px Arial;fill:#10233f}.sub{font:16px Arial;fill:#53677f}.head{font:700 19px Arial;fill:#142b49}.txt{font:15px Arial;fill:#405873}.small{font:13px Arial;fill:#5c718a}
 .card{fill:#fff;stroke:#d7e2ef;stroke-width:1.5;rx:18;filter:url(#shadow)}.line{stroke:#58718d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
 </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="65" y="70" class="title">Production Operations Architecture</text>
<text x="65" y="103" class="sub">Operate, observe, protect, recover, and continuously improve the production platform</text>

<rect x="55" y="145" width="1490" height="440" rx="24" fill="#f0f5fc" stroke="#d5e1ef"/>
<text x="85" y="185" class="head">Production operations control loop</text>

<!-- workload -->
<rect x="85" y="235" width="235" height="260" class="card"/>
<polygon points="145,255 172,270 172,300 145,315 118,300 118,270" fill="#326ce5"/>
<text x="145" y="293" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#fff">K8s</text>
<text x="190" y="286" class="head">EKS platform</text>
<text x="110" y="350" class="txt">21 microservices</text>
<text x="110" y="380" class="txt">Kubernetes workloads</text>
<text x="110" y="410" class="txt">RDS / Redis / messaging</text>
<text x="110" y="440" class="txt">AWS networking &amp; IAM</text>

<!-- observe -->
<rect x="365" y="235" width="255" height="260" class="card"/>
<circle cx="425" cy="285" r="29" fill="#0f766e"/>
<path d="M407 288h10l7-16 9 29 7-13h10" stroke="#fff" stroke-width="3" fill="none" stroke-linejoin="round"/>
<text x="475" y="286" class="head">Observe</text>
<text x="390" y="350" class="txt">Prometheus metrics</text>
<text x="390" y="380" class="txt">Grafana dashboards</text>
<text x="390" y="410" class="txt">Alertmanager alerts</text>
<text x="390" y="440" class="txt">Fluent Bit / ELK logs</text>

<!-- incident -->
<rect x="665" y="235" width="255" height="260" class="card"/>
<circle cx="725" cy="285" r="29" fill="#d97706"/>
<path d="M725 266v23 M725 299v2" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text x="775" y="286" class="head">Respond</text>
<text x="690" y="350" class="txt">Alert triage</text>
<text x="690" y="380" class="txt">Incident ownership</text>
<text x="690" y="410" class="txt">Mitigation / rollback</text>
<text x="690" y="440" class="txt">RCA and follow-up</text>

<!-- protect -->
<rect x="965" y="235" width="235" height="260" class="card"/>
<path d="M1025 255l34 12v29c0 24-17 37-34 47-17-10-34-23-34-47v-29z" fill="#0f9876"/>
<path d="M1010 297l11 11 20-24" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
<text x="1075" y="286" class="head">Protect</text>
<text x="990" y="350" class="txt">IAM / RBAC</text>
<text x="990" y="380" class="txt">Image and code scanning</text>
<text x="990" y="410" class="txt">Secrets management</text>
<text x="990" y="440" class="txt">Network controls</text>

<!-- improve -->
<rect x="1245" y="235" width="265" height="260" class="card"/>
<circle cx="1305" cy="285" r="29" fill="#475569"/>
<path d="M1292 286l9 9 18-21" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
<text x="1355" y="286" class="head">Improve</text>
<text x="1270" y="350" class="txt">Capacity planning</text>
<text x="1270" y="380" class="txt">Performance tuning</text>
<text x="1270" y="410" class="txt">Automation / runbooks</text>
<text x="1270" y="440" class="txt">Reliability actions</text>

<path d="M320 365H355" class="line"/><path d="M620 365H655" class="line"/><path d="M920 365H955" class="line"/><path d="M1200 365H1235" class="line"/>
<path d="M1375 505V545H205V505" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="790" y="535" class="small" text-anchor="middle">feedback loop: lessons learned and preventive changes</text>

<!-- lower panels -->
<rect x="55" y="635" width="700" height="285" rx="22" fill="#fff" stroke="#d7e2ef" filter="url(#shadow)"/>
<text x="85" y="680" class="head">Daily / weekly operational checks</text>
<g class="txt">
<text x="95" y="730">• Check service availability, latency and error rates</text>
<text x="95" y="770">• Review Pod restarts, node pressure and pending Pods</text>
<text x="95" y="810">• Review deployment health and GitOps drift</text>
<text x="95" y="850">• Check database, cache and messaging health</text>
<text x="95" y="890">• Review backup status, security findings and alerts</text>
</g>

<rect x="800" y="635" width="745" height="285" rx="22" fill="#fff" stroke="#d7e2ef" filter="url(#shadow)"/>
<text x="830" y="680" class="head">Incident handling lifecycle</text>
<g>
<rect x="845" y="725" width="145" height="78" rx="13" fill="#edf4ff" stroke="#d2e2f8"/>
<text x="917" y="758" text-anchor="middle" class="head">Detect</text><text x="917" y="783" text-anchor="middle" class="small">alert / report</text>
<path d="M990 764H1015" class="line"/>
<rect x="1025" y="725" width="145" height="78" rx="13" fill="#edf4ff" stroke="#d2e2f8"/>
<text x="1097" y="758" text-anchor="middle" class="head">Triage</text><text x="1097" y="783" text-anchor="middle" class="small">scope / severity</text>
<path d="M1170 764H1195" class="line"/>
<rect x="1205" y="725" width="145" height="78" rx="13" fill="#fff4ee" stroke="#f0d2c4"/>
<text x="1277" y="758" text-anchor="middle" class="head">Mitigate</text><text x="1277" y="783" text-anchor="middle" class="small">restore service</text>
<path d="M1350 764H1375" class="line"/>
<rect x="1385" y="725" width="125" height="78" rx="13" fill="#edf8f3" stroke="#cde8d9"/>
<text x="1447" y="758" text-anchor="middle" class="head">Learn</text><text x="1447" y="783" text-anchor="middle" class="small">RCA / actions</text>
</g>
<text x="845" y="850" class="txt">Record timeline, impact, root cause, remediation and action owners.</text>
<text x="845" y="880" class="small">Validate recovery with service-level signals, not only Pod status.</text>
<text x="65" y="965" class="small">Reference operating model: adapt checks, escalation paths, SLOs and runbooks to the actual team's ownership and production setup.</text>
</svg>