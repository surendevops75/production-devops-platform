<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#193454" flood-opacity=".12"/></filter>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
 <style>
 .title{font:700 30px Arial;fill:#14233b}.sub{font:16px Arial;fill:#53647c}.h{font:700 19px Arial;fill:#172b4d}.t{font:15px Arial;fill:#34465f}.s{font:13px Arial;fill:#52627a}.w{fill:#fff}
 .card{fill:#fff;stroke:#d6e1ef;stroke-width:2;rx:17;filter:url(#sh)}.pill{fill:#eff6ff;stroke:#bfdbfe;stroke-width:1.5;rx:10}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arr)}
 </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="65" y="65" class="title">Kubernetes Architecture on Amazon EKS</text>
<text x="65" y="96" class="sub">Control plane • worker nodes • workloads • services • ingress • platform operations</text>
<rect x="65" y="130" width="1470" height="85" rx="18" fill="#142d4d"/>
<text x="95" y="166" class="w" style="font:700 20px Arial">KUBERNETES PLATFORM MODEL</text>
<text x="95" y="194" class="w" style="font:15px Arial">Desired state through Kubernetes API • scheduling • reconciliation • service discovery • health and scaling</text>

<!-- external -->
<rect x="65" y="280" width="245" height="210" class="card"/>
<rect x="65" y="280" width="245" height="52" rx="17" fill="#1d4ed8"/>
<text x="90" y="314" class="w" style="font:700 18px Arial">Client traffic</text>
<circle cx="125" cy="385" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<path d="M101 385h48M125 361c-15 15-15 33 0 48M125 361c15 15 15 33 0 48" stroke="#2563eb" fill="none" stroke-width="2"/>
<text x="170" y="385" class="h">HTTPS</text><text x="170" y="410" class="s">External requests</text>
<rect x="95" y="435" width="185" height="35" class="pill"/><text x="115" y="458" class="t">ALB / Ingress</text>

<!-- control plane -->
<rect x="360" y="280" width="390" height="210" class="card"/>
<rect x="360" y="280" width="390" height="52" rx="17" fill="#326ce5"/>
<text x="390" y="314" class="w" style="font:700 18px Arial">Amazon EKS control plane</text>
<rect x="395" y="360" width="145" height="52" class="pill"/><text x="415" y="392" class="t">API Server</text>
<rect x="565" y="360" width="145" height="52" class="pill"/><text x="585" y="392" class="t">Scheduler</text>
<rect x="395" y="425" width="145" height="42" class="pill"/><text x="415" y="452" class="t">etcd*</text>
<rect x="565" y="425" width="145" height="42" class="pill"/><text x="585" y="452" class="t">Controllers</text>

<!-- worker -->
<rect x="800" y="255" width="735" height="440" rx="22" fill="#f0f7ff" stroke="#60a5fa" stroke-width="3"/>
<rect x="825" y="275" width="300" height="45" rx="12" fill="#1d4ed8"/>
<text x="850" y="305" class="w" style="font:700 18px Arial">EKS worker node groups</text>
<text x="1150" y="303" class="s">Private subnets • Availability Zones</text>

<!-- node 1 -->
<rect x="835" y="350" width="310" height="305" rx="16" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
<text x="860" y="383" class="h">Worker Node A</text>
<rect x="860" y="405" width="260" height="48" class="pill"/><text x="880" y="435" class="t">kubelet • container runtime</text>
<rect x="860" y="470" width="260" height="75" rx="11" fill="#eff6ff" stroke="#bfdbfe"/><text x="880" y="500" class="h">Application pods</text><text x="880" y="524" class="s">User • Product • Cart</text>
<rect x="860" y="560" width="260" height="70" rx="11" fill="#f0fdf4" stroke="#bbf7d0"/><text x="880" y="590" class="h">Platform pods</text><text x="880" y="614" class="s">CNI • DNS • agents</text>

<!-- node 2 -->
<rect x="1170" y="350" width="335" height="305" rx="16" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
<text x="1195" y="383" class="h">Worker Node B</text>
<rect x="1195" y="405" width="285" height="48" class="pill"/><text x="1215" y="435" class="t">kubelet • container runtime</text>
<rect x="1195" y="470" width="285" height="75" rx="11" fill="#eff6ff" stroke="#bfdbfe"/><text x="1215" y="500" class="h">Application pods</text><text x="1215" y="524" class="s">Order • Payment • Inventory</text>
<rect x="1195" y="560" width="285" height="70" rx="11" fill="#f0fdf4" stroke="#bbf7d0"/><text x="1215" y="590" class="h">Platform pods</text><text x="1215" y="614" class="s">Metrics • logging agents</text>

<path d="M310 390H350" class="line"/><path d="M750 390H790" class="line"/>

<!-- lower components -->
<rect x="65" y="555" width="245" height="300" class="card"/>
<text x="95" y="595" class="h">Kubernetes Services</text>
<rect x="95" y="625" width="185" height="48" class="pill"/><text x="115" y="655" class="t">ClusterIP</text>
<rect x="95" y="690" width="185" height="48" class="pill"/><text x="115" y="720" class="t">Service DNS</text>
<rect x="95" y="755" width="185" height="48" class="pill"/><text x="115" y="785" class="t">Ingress routing</text>

<rect x="360" y="555" width="390" height="300" class="card"/>
<text x="390" y="595" class="h">Cluster operations</text>
<rect x="395" y="625" width="320" height="48" class="pill"/><text x="415" y="655" class="t">Deployments • ReplicaSets • Pods</text>
<rect x="395" y="690" width="320" height="48" class="pill"/><text x="415" y="720" class="t">ConfigMaps • Secrets • RBAC</text>
<rect x="395" y="755" width="320" height="48" class="pill"/><text x="415" y="785" class="t">HPA • probes • resource limits</text>

<rect x="800" y="735" width="735" height="120" rx="17" fill="#fff" stroke="#d6e1ef" stroke-width="2" filter="url(#sh)"/>
<text x="830" y="775" class="h">Platform integrations</text>
<text x="830" y="810" class="t">ECR images • Helm charts • Argo CD • Prometheus / Grafana • Fluent Bit / ELK</text>
<text x="65" y="930" class="s">* EKS control-plane internals are AWS-managed; etcd is shown conceptually and is not directly operated by the customer. Node layout is illustrative.</text>
</svg>