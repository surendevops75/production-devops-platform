<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#193454" flood-opacity=".12"/></filter>
 <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker>
 <style>
 .title{font:700 30px Arial;fill:#14233b}.sub{font:16px Arial;fill:#53647c}.h{font:700 19px Arial;fill:#172b4d}.t{font:15px Arial;fill:#34465f}.s{font:13px Arial;fill:#52627a}.w{fill:#fff}
 .card{fill:#fff;stroke:#d6e1ef;stroke-width:2;rx:17;filter:url(#sh)}.pill{fill:#f5f3ff;stroke:#ddd6fe;stroke-width:1.5;rx:10}.line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arr)}
 </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="65" y="65" class="title">Secrets Management Architecture</text>
<text x="65" y="96" class="sub">Credential protection • identity-based access • secure delivery to Kubernetes workloads</text>
<rect x="65" y="130" width="1470" height="88" rx="18" fill="#142d4d"/>
<text x="95" y="167" class="w" style="font:700 20px Arial">SECURITY PRINCIPLES</text>
<text x="95" y="195" class="w" style="font:15px Arial">No secrets in Git • least privilege • short-lived identity where possible • rotation • audit access</text>

<!-- users and CI -->
<rect x="65" y="285" width="330" height="265" class="card"/>
<rect x="65" y="285" width="330" height="55" rx="17" fill="#1d4ed8"/>
<text x="95" y="320" class="w" style="font:700 19px Arial">1  Developers &amp; CI/CD</text>
<rect x="100" y="375" width="260" height="55" class="pill"/><text x="125" y="409" class="t">GitHub repository</text>
<rect x="100" y="450" width="260" height="55" class="pill"/><text x="125" y="484" class="t">GitHub Actions workflows</text>
<text x="100" y="527" class="s">Secret values are not committed</text>

<!-- identity -->
<rect x="465" y="285" width="330" height="265" class="card"/>
<rect x="465" y="285" width="330" height="55" rx="17" fill="#7c3aed"/>
<text x="495" y="320" class="w" style="font:700 19px Arial">2  Identity &amp; authorization</text>
<path d="M520 390l34-18 34 18v37c0 25-34 43-34 43s-34-18-34-43z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<circle cx="554" cy="410" r="8" fill="none" stroke="#6d28d9" stroke-width="3"/><path d="M554 418v13" stroke="#6d28d9" stroke-width="3"/>
<text x="610" y="405" class="h">IAM / OIDC</text><text x="610" y="430" class="s">Federated CI identity*</text>
<rect x="500" y="485" width="260" height="42" class="pill"/><text x="520" y="512" class="t">Kubernetes RBAC / IRSA*</text>

<!-- secret store -->
<rect x="865" y="285" width="315" height="265" class="card"/>
<rect x="865" y="285" width="315" height="55" rx="17" fill="#0f766e"/>
<text x="895" y="320" class="w" style="font:700 19px Arial">3  Secret source</text>
<rect x="905" y="380" width="235" height="70" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
<path d="M940 408a14 14 0 1 1 28 0v22h-28z" fill="#a7f3d0" stroke="#059669" stroke-width="2"/><circle cx="954" cy="410" r="4" fill="#059669"/>
<text x="985" y="409" class="h">Approved vault</text><text x="985" y="433" class="s">Secret store*</text>
<text x="905" y="485" class="s">Examples: AWS Secrets Manager,</text><text x="905" y="506" class="s">Kubernetes Secrets or approved vault</text>

<!-- cluster -->
<rect x="1250" y="285" width="285" height="265" class="card"/>
<rect x="1250" y="285" width="285" height="55" rx="17" fill="#b45309"/>
<text x="1280" y="320" class="w" style="font:700 19px Arial">4  EKS workloads</text>
<polygon points="1300,395 1315,370 1345,370 1360,395 1345,420 1315,420" fill="#326ce5"/>
<text x="1308" y="401" class="w" style="font:700 13px Arial">K8s</text>
<text x="1380" y="395" class="h">Pods</text><text x="1380" y="420" class="s">21 services</text>
<rect x="1285" y="465" width="215" height="55" class="pill"/><text x="1305" y="499" class="t">Runtime secret access</text>

<path d="M395 415H455" class="line"/><path d="M795 415H855" class="line"/><path d="M1180 415H1240" class="line"/>

<!-- lower controls -->
<rect x="65" y="620" width="1470" height="250" rx="18" fill="#fff" stroke="#d6e1ef" stroke-width="2" filter="url(#sh)"/>
<text x="95" y="662" class="h">5  Secret lifecycle and operational controls</text>
<rect x="100" y="700" width="250" height="100" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="125" y="738" class="h">Create</text><text x="125" y="765" class="s">Approved secret source</text><text x="125" y="785" class="s">No plaintext in Git</text>
<rect x="390" y="700" width="250" height="100" rx="12" fill="#f5f3ff" stroke="#ddd6fe"/><text x="415" y="738" class="h">Grant access</text><text x="415" y="765" class="s">IAM / RBAC policies</text><text x="415" y="785" class="s">Service-specific identity</text>
<rect x="680" y="700" width="250" height="100" rx="12" fill="#ecfdf5" stroke="#bbf7d0"/><text x="705" y="738" class="h">Deliver securely</text><text x="705" y="765" class="s">Runtime retrieval / mount</text><text x="705" y="785" class="s">Avoid image-baked secrets</text>
<rect x="970" y="700" width="250" height="100" rx="12" fill="#fff7ed" stroke="#fed7aa"/><text x="995" y="738" class="h">Rotate &amp; revoke</text><text x="995" y="765" class="s">Rotation schedule</text><text x="995" y="785" class="s">Incident revocation</text>
<rect x="1260" y="700" width="235" height="100" rx="12" fill="#fef2f2" stroke="#fecaca"/><text x="1285" y="738" class="h">Audit</text><text x="1285" y="765" class="s">Access logs</text><text x="1285" y="785" class="s">Exposure response</text>
<path d="M350 750H380" class="line"/><path d="M640 750H670" class="line"/><path d="M930 750H960" class="line"/><path d="M1220 750H1250" class="line"/>
<text x="65" y="930" class="s">* Choose the actual secret store and EKS integration before implementation. Kubernetes Secrets require encryption-at-rest and RBAC hardening; do not assume a managed vault is configured.</text>
</svg>