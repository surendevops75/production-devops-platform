<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf1fa"/></linearGradient>
 <linearGradient id="app" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183153" flood-opacity=".12"/></filter>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#58718d"/></marker>
 <style>
 .title{font:700 34px Arial;fill:#10233f}.sub{font:16px Arial;fill:#53677f}.head{font:700 19px Arial;fill:#142b49}.txt{font:15px Arial;fill:#405873}.small{font:13px Arial;fill:#5c718a}
 .card{fill:#fff;stroke:#d7e2ef;stroke-width:1.5;rx:18;filter:url(#shadow)}.line{stroke:#58718d;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
 </style>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="65" y="70" class="title">Application Deployment Architecture</text>
<text x="65" y="103" class="sub">From client request and ingress routing to Kubernetes services, microservice pods, and data dependencies</text>

<rect x="55" y="145" width="1490" height="470" rx="24" fill="#f0f5fc" stroke="#d5e1ef"/>
<text x="85" y="185" class="head">Request path and application runtime on Amazon EKS</text>

<!-- client -->
<rect x="85" y="245" width="200" height="235" class="card"/>
<circle cx="145" cy="295" r="28" fill="#475569"/>
<circle cx="145" cy="286" r="9" fill="#fff"/><path d="M128 315c2-18 32-18 34 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
<text x="190" y="292" class="head">Client</text>
<text x="110" y="355" class="txt">Web / mobile app</text>
<text x="110" y="385" class="txt">HTTPS request</text>
<text x="110" y="415" class="txt">API endpoint</text>

<!-- ingress -->
<rect x="350" y="245" width="220" height="235" class="card"/>
<path d="M390 278h64v38h-64z M402 290h40 M402 302h40" fill="#e98b27" stroke="#b86a17" stroke-width="2"/>
<text x="470" y="292" class="head">ALB / Ingress</text>
<text x="375" y="355" class="txt">TLS termination</text>
<text x="375" y="385" class="txt">Host / path routing</text>
<text x="375" y="415" class="txt">Forward to Service</text>

<!-- EKS boundary -->
<rect x="635" y="215" width="625" height="340" rx="22" fill="#fff" stroke="#9bb8e8" stroke-width="2" filter="url(#shadow)"/>
<polygon points="690,238 716,253 716,283 690,298 664,283 664,253" fill="#326ce5"/>
<text x="690" y="276" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">K8s</text>
<text x="735" y="272" class="head">Amazon EKS cluster</text>
<text x="735" y="296" class="small">Private worker nodes • namespaces • Kubernetes networking</text>

<!-- service -->
<rect x="680" y="330" width="175" height="155" rx="14" fill="#edf4ff" stroke="#cbdcf5"/>
<circle cx="720" cy="370" r="18" fill="#2563eb"/>
<path d="M710 370h20 M720 360v20" stroke="#fff" stroke-width="3"/>
<text x="750" y="375" class="head">Service</text>
<text x="700" y="420" class="txt">ClusterIP</text>
<text x="700" y="448" class="txt">Stable endpoint</text>

<!-- pods -->
<rect x="895" y="330" width="320" height="155" rx="14" fill="#f4f8fd" stroke="#cbdcf5"/>
<text x="920" y="365" class="head">Microservice Deployments</text>
<g>
<rect x="920" y="390" width="82" height="66" rx="10" fill="#fff" stroke="#cbdcf5"/>
<rect x="1014" y="390" width="82" height="66" rx="10" fill="#fff" stroke="#cbdcf5"/>
<rect x="1108" y="390" width="82" height="66" rx="10" fill="#fff" stroke="#cbdcf5"/>
<g fill="#326ce5"><circle cx="961" cy="411" r="8"/><circle cx="1055" cy="411" r="8"/><circle cx="1149" cy="411" r="8"/></g>
<g class="small" text-anchor="middle"><text x="961" y="440">Pod A</text><text x="1055" y="440">Pod B</text><text x="1149" y="440">Pod C</text></g>
</g>
<text x="920" y="475" class="small">ReplicaSets • rolling updates • health probes</text>

<!-- external data -->
<rect x="1320" y="245" width="190" height="235" class="card"/>
<rect x="1360" y="270" width="70" height="54" rx="8" fill="#0f766e"/>
<ellipse cx="1395" cy="282" rx="25" ry="8" fill="#fff" opacity=".9"/>
<path d="M1370 282v30c0 10 50 10 50 0v-30" stroke="#fff" stroke-width="2" fill="none"/>
<text x="1440" y="292" class="head">Data</text>
<text x="1345" y="355" class="txt">Amazon RDS</text>
<text x="1345" y="385" class="txt">Redis cache</text>
<text x="1345" y="415" class="txt">Messaging</text>
<text x="1345" y="445" class="small">As configured per service</text>

<path d="M285 360H340" class="line"/>
<path d="M570 360H625" class="line"/>
<path d="M855 408H885" class="line"/>
<path d="M1215 408H1310" class="line"/>
<text x="310" y="335" class="small" text-anchor="middle">HTTPS</text>
<text x="600" y="335" class="small" text-anchor="middle">Ingress rule</text>
<text x="870" y="388" class="small" text-anchor="middle">selects pods</text>
<text x="1265" y="388" class="small" text-anchor="middle">private access</text>

<!-- lower panels -->
<rect x="55" y="665" width="700" height="250" rx="22" fill="#fff" stroke="#d7e2ef" filter="url(#shadow)"/>
<text x="85" y="710" class="head">Deployment and availability controls</text>
<g class="txt">
<text x="95" y="760">• Deployment replicas and rolling update strategy</text>
<text x="95" y="800">• Readiness and liveness probes</text>
<text x="95" y="840">• CPU / memory requests and limits</text>
<text x="95" y="880">• Horizontal Pod Autoscaler, when configured</text>
</g>

<rect x="800" y="665" width="745" height="250" rx="22" fill="#fff" stroke="#d7e2ef" filter="url(#shadow)"/>
<text x="830" y="710" class="head">Delivery and operational integration</text>
<g>
<rect x="845" y="750" width="145" height="75" rx="13" fill="#edf4ff" stroke="#d2e2f8"/>
<text x="917" y="780" text-anchor="middle" class="head">CI</text><text x="917" y="805" text-anchor="middle" class="small">build / scan</text>
<path d="M990 787H1015" class="line"/>
<rect x="1025" y="750" width="145" height="75" rx="13" fill="#edf4ff" stroke="#d2e2f8"/>
<text x="1097" y="780" text-anchor="middle" class="head">ECR</text><text x="1097" y="805" text-anchor="middle" class="small">container image</text>
<path d="M1170 787H1195" class="line"/>
<rect x="1205" y="750" width="145" height="75" rx="13" fill="#fff3ed" stroke="#f2d4c4"/>
<text x="1277" y="780" text-anchor="middle" class="head">Argo CD</text><text x="1277" y="805" text-anchor="middle" class="small">GitOps sync</text>
<path d="M1350 787H1375" class="line"/>
<rect x="1385" y="750" width="125" height="75" rx="13" fill="#edf8f3" stroke="#cde8d9"/>
<text x="1447" y="780" text-anchor="middle" class="head">Observe</text><text x="1447" y="805" text-anchor="middle" class="small">metrics / logs</text>
</g>
<text x="845" y="865" class="txt">Prometheus • Grafana • Alertmanager • Fluent Bit / ELK</text>
<text x="65" y="965" class="small">Conceptual application path: actual service routing, data dependencies, ingress controller and scaling policies depend on the deployed configuration.</text>
</svg>