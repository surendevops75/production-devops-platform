<rect x="1270" y="545" width="470" height="70" rx="9" fill="#fff" stroke="#7cab7c"/>
<text x="1505" y="573" text-anchor="middle" class="head">Kubernetes Deployment</text><text x="1505" y="594" text-anchor="middle" class="tiny">Helm chart • values • image reference</text>
<rect x="1270" y="635" width="220" height="65" rx="9" fill="#fff" stroke="#7cab7c"/>
<text x="1380" y="662" text-anchor="middle" class="head">Rolling Update</text><text x="1380" y="682" text-anchor="middle" class="tiny">Readiness-based rollout</text>
<rect x="1520" y="635" width="220" height="65" rx="9" fill="#fff" stroke="#7cab7c"/>
<text x="1630" y="662" text-anchor="middle" class="head">Health Validation</text><text x="1630" y="682" text-anchor="middle" class="tiny">Pods / Services / ingress</text>
<rect x="1270" y="720" width="470" height="48" rx="8" fill="#fff" stroke="#7cab7c"/>
<text x="1505" y="749" text-anchor="middle" class="body">Rollback: revert GitOps change or restore previous image version</text>

<!-- Feedback and controls -->
<rect x="570" y="845" width="1200" height="185" rx="14" fill="#f8fafc" stroke="#8a9aab" stroke-width="1.5"/>
<text x="1170" y="877" text-anchor="middle" class="section">Pipeline Controls &amp; Operational Feedback</text>
<g>
 <rect x="600" y="900" width="250" height="85" rx="8" fill="#fff" stroke="#8a9aab"/>
 <text x="725" y="928" text-anchor="middle" class="head">Artifact Traceability</text><text x="725" y="950" text-anchor="middle" class="tiny">Commit SHA • image digest • build ID</text><text x="725" y="967" text-anchor="middle" class="tiny">Release metadata</text>
 <rect x="875" y="900" width="250" height="85" rx="8" fill="#fff" stroke="#8a9aab"/>
 <text x="1000" y="928" text-anchor="middle" class="head">Approvals &amp; Environments</text><text x="1000" y="950" text-anchor="middle" class="tiny">Branch protection • reviewers</text><text x="1000" y="967" text-anchor="middle" class="tiny">Environment promotion rules</text>
 <rect x="1150" y="900" width="250" height="85" rx="8" fill="#fff" stroke="#8a9aab"/>
 <text x="1275" y="928" text-anchor="middle" class="head">Secrets &amp; Permissions</text><text x="1275" y="950" text-anchor="middle" class="tiny">OIDC • least privilege • no static keys</text><text x="1275" y="967" text-anchor="middle" class="tiny">Protected variables / secrets</text>
 <rect x="1425" y="900" width="315" height="85" rx="8" fill="#fff" stroke="#8a9aab"/>
 <text x="1582" y="928" text-anchor="middle" class="head">Deployment Verification</text><text x="1582" y="950" text-anchor="middle" class="tiny">Argo CD health • rollout status</text><text x="1582" y="967" text-anchor="middle" class="tiny">Metrics / logs / alerts</text>
</g>

