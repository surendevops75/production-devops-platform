<rect width="100%" height="100%" fill="#fff"/>
<text x="900" y="42" text-anchor="middle" class="title">production-devops-platform — CI/CD Architecture</text>
<text x="900" y="68" text-anchor="middle" class="sub">GitHub Actions CI | Security gates | Amazon ECR | GitOps repository | Argo CD delivery</text>

