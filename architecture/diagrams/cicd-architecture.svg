<text x="1362" y="260" text-anchor="middle" class="head">Helm Values</text><text x="1362" y="277" text-anchor="middle" class="tiny">Image tag / digest / config</text>
<rect x="1265" y="305" width="195" height="48" rx="7" fill="#fff" stroke="#7952a3"/>
<text x="1362" y="325" text-anchor="middle" class="head">Pull Request / Merge</text><text x="1362" y="342" text-anchor="middle" class="tiny">Review desired-state change</text>

<!-- CD -->
<rect x="1540" y="155" width="230" height="225" rx="14" fill="#f7f2fc" stroke="#7952a3" stroke-width="1.8"/>
<circle cx="1590" cy="200" r="22" fill="#7952a3"/>
<path d="M1578 200 Q1590 180 1602 200 Q1590 220 1578 200Z" fill="none" stroke="#fff" stroke-width="2"/>
