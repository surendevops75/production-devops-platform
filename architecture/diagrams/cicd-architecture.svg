<text x="875" y="140" text-anchor="middle" class="section">CI — GitHub Actions Workflow</text>
<!-- runner -->
<rect x="600" y="160" width="550" height="55" rx="9" fill="#fff0e5" stroke="#e87524"/>
<circle cx="635" cy="187" r="17" fill="#e87524"/><path d="M626 187 L633 194 L645 179" fill="none" stroke="#fff" stroke-width="2.5"/>
<text x="880" y="184" text-anchor="middle" class="head">Workflow Trigger &amp; Runner</text><text x="880" y="202" text-anchor="middle" class="tiny">Push / PR • Ubuntu runner • workflow permissions</text>

<!-- pipeline stages -->
<g>
 <rect x="600" y="240" width="550" height="66" rx="9" fill="#fff" stroke="#e87524"/>
 <circle cx="635" cy="273" r="17" fill="#fff0e5" stroke="#e87524" stroke-width="2"/><text x="635" y="278" text-anchor="middle" class="head">1</text>
 <text x="880" y="267" text-anchor="middle" class="head">Checkout &amp; Dependency Setup</text><text x="880" y="287" text-anchor="middle" class="tiny">Checkout code • install dependencies • cache where appropriate</text>
 <rect x="600" y="325" width="550" height="66" rx="9" fill="#fff" stroke="#e87524"/>
 <circle cx="635" cy="358" r="17" fill="#fff0e5" stroke="#e87524" stroke-width="2"/><text x="635" y="363" text-anchor="middle" class="head">2</text>
 <text x="880" y="352" text-anchor="middle" class="head">Build &amp; Automated Tests</text><text x="880" y="372" text-anchor="middle" class="tiny">Compile / package • unit tests • integration tests as configured</text>
 <rect x="600" y="410" width="550" height="90" rx="9" fill="#fff" stroke="#d49a45"/>
 <circle cx="635" cy="455" r="17" fill="#fff4df" stroke="#d49a45" stroke-width="2"/><text x="635" y="460" text-anchor="middle" class="head">3</text>
 <text x="880" y="438" text-anchor="middle" class="head">Code &amp; Dependency Security Gates</text>
 <text x="880" y="460" text-anchor="middle" class="body">SonarQube • dependency / secret scanning</text>
 <text x="880" y="480" text-anchor="middle" class="tiny">Quality gate must pass before image publication</text>
 <rect x="600" y="520" width="550" height="90" rx="9" fill="#fff" stroke="#d49a45"/>
 <circle cx="635" cy="565" r="17" fill="#fff4df" stroke="#d49a45" stroke-width="2"/><text x="635" y="570" text-anchor="middle" class="head">4</text>
 <text x="880" y="548" text-anchor="middle" class="head">Container Build &amp; Security Scan</text>
 <text x="880" y="570" text-anchor="middle" class="body">Docker build • Trivy image scan • SBOM generation</text>
 <text x="880" y="590" text-anchor="middle" class="tiny">Reject or hold images according to configured policy</text>
 <rect x="600" y="630" width="550" height="75" rx="9" fill="#fff0e5" stroke="#e87524"/>
 <circle cx="635" cy="667" r="17" fill="#e87524"/><text x="635" y="672" text-anchor="middle" fill="#fff" class="head">5</text>
 <text x="880" y="660" text-anchor="middle" class="head">Authenticate &amp; Publish to Amazon ECR</text>
 <text x="880" y="682" text-anchor="middle" class="tiny">OIDC role assumption • immutable version tag / digest</text>
</g>

<!-- GitOps repo -->
<rect x="1240" y="155" width="245" height="225" rx="14" fill="#f7f2fc" stroke="#7952a3" stroke-width="1.8"/>
<path d="M1270 183 L1290 171 L1310 183 V207 L1290 219 L1270 207Z" fill="none" stroke="#7952a3" stroke-width="2.5"/>
