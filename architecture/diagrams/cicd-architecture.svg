<text x="1655" y="265" text-anchor="middle" class="head">Repo Sync</text><text x="1655" y="282" text-anchor="middle" class="tiny">Compare desired / live state</text>
<rect x="1565" y="310" width="180" height="48" rx="7" fill="#fff" stroke="#7952a3"/>
<text x="1655" y="330" text-anchor="middle" class="head">Sync / Health</text><text x="1655" y="347" text-anchor="middle" class="tiny">Apply Helm release</text>

