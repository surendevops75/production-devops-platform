<rect x="1240" y="455" width="530" height="340" rx="15" fill="#f2faf2" stroke="#388b45" stroke-width="2"/>
<g transform="translate(1270 475)"><path d="M25 0 L48 13 V40 L25 53 L2 40 V13Z" fill="#438b45"/><path d="M25 9 L39 17 V35 L25 44 L11 35 V17Z" fill="none" stroke="#fff" stroke-width="2"/></g>
